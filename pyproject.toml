[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "zamp_sdk"
version = "0.0.1"
description = "Customer-facing SDK for executing actions on the Zamp platform"
readme = "README.md"
license = "MIT"
authors = ["Zamp Engineering <engineering@zamp.com>"]
packages = [{include = "zamp_sdk"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
zamp-public-workflow-sdk = {git = "ssh://git@github.com/Zampfi/public-workflow-sdk.git", branch = "parul/actions-sdk"}
aiohttp = "*"
pydantic = "*"
structlog = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
ruff = "*"
mypy = "*"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
relative_files = true
